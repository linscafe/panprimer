[build-system]
# maturin, not setuptools: the package now ships a compiled Rust extension
# (`pangenome_primer._scan`, source in rust/pgp-scan) alongside the pure-Python modules.
# The Python side is unchanged -- see [tool.maturin] below for the mixed layout.
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "pangenome-primer"
version = "0.1.0"
description = "Design universal PCR primers against the HPRC R2 human pangenome"
requires-python = ">=3.10"
dependencies = [
    "primer3-py>=2.0",
    "pysam>=0.22",
    "mappy>=2.26",
    "click>=8.1",
    "jinja2>=3.1",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
pangenome-primer = "pangenome_primer.cli:cli"

[tool.maturin]
# Mixed Rust/Python project: Python package under src/, Rust crate under rust/pgp-scan.
python-source = "src"
manifest-path = "rust/pgp-scan/Cargo.toml"
module-name = "pangenome_primer._scan"
features = ["pyo3/extension-module"]
# The extension does not raise at import (see pangenome_primer/rust_backend.py), but it is
# REQUIRED for genome-scale search: there is no fallback backend. Without it,
# `search.resolve_backend` raises with a build hint. `search.backend` in
# config/defaults.yaml is the selector.

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
